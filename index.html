<script>function renderTrends(list=trends){

  const container =
    document.getElementById("trendList");

  if(!list.length){

    container.innerHTML =
      '<div class="empty">Bu aramaya uygun trend bulunamadı.</div>';

    return;
  }

  container.innerHTML = list

    .sort((a,b)=>b.score-a.score)

    .map((item,index)=>`

      <div
        class="trend"
        onclick="selectTrend(${index})"
        style="cursor:pointer"
      >

        <div>

          <div class="trend-name">
            ${item.trend}
          </div>

          <div class="trend-info">
            Arama hacmi: ${item.traffic}
            · Ticari aday: ${item.category}
          </div>

          <span class="badge">

            ${
              item.score >= 85
              ? "GÜÇLÜ SİNYAL"
              : item.score >= 70
              ? "AKTİF"
              : "İNCELENECEK"
            }

          </span>

        </div>

        <div class="score">
          ${item.score}/100
        </div>

      </div>

    `)

    .join("");

  updateStats();

}


function selectTrend(index){

  const item =
    trends
      .sort((a,b)=>b.score-a.score)[index];

  if(!item) return;

  /*
    Radar skorunu
    Ticari Fırsat Motoru'na aktar
  */

  document.getElementById("demand").value =
    item.score;

  /*
    Kullanıcıya hangi trendi
    seçtiğini göster
  */

  const result =
    document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = `

    <div class="result-title">
      RADAR → FIRSAT MOTORU
    </div>

    <strong>
      🎯 ${item.trend}
    </strong>

    <div class="recommend">

      Radar sinyali:
      <b>${item.score}/100</b>

      <br><br>

      Kategori:
      <b>${item.category}</b>

      <br><br>

      Talep skoru otomatik olarak
      Fırsat Motoru'na aktarıldı.

      <br><br>

      Şimdi maliyet ve satış fiyatını
      girip <b>Fırsatı Hesapla</b>'ya bas.

    </div>

  `;

  document
    .getElementById("cost")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}
